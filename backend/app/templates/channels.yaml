# 内容渠道模板：定义各渠道的文案风格、长度、结构与 SEO 要求。
# 文案创作 Agent 依据渠道模板生成内容；审校 Agent 依据模板检查合规性。
# copywriting_guide 提炼自 agency-agents-zh 渠道专家 Agent 方法论。
channels:
  xiaohongshu:
    name: 小红书
    desc: 种草笔记（图文）
    tone: 亲切口语化、有生活感、善用表情与语气词，像朋友分享
    max_chars: 1200
    structure: 爆款开头抓眼球 → 场景痛点共鸣 → 产品卖点展开 → 亲测体验 → 行动号召
    require_hashtags: true
    require_emoji: true
    seo_keywords: 标题与正文自然植入搜索关键词
    copywriting_guide:
      title_rule: 标题 18-20 字，含关键词 + 情绪触发词。可用公式：后悔没早买式、真实体验式（用了30天）、平替避坑式（别再交智商税了）
      body_structure: 300-600 字四段式：痛点共鸣（1-2句，让读者觉得说的就是我）→ 产品/方案自然引入（不突兀）→ 使用体验/效果（具体、有细节、有数据）→ 总结推荐（适当降低期望更真实）
      tags_rule: 2-3 个热门大标签 + 3-5 个精准长尾标签
      style: 小红书味、懂梗懂审美、生活方式视角不硬推、真实声音不企业腔；情感钩子 + 趋势语言 + 策略性 CTA；内容配比 70% 生活方式 / 20% 趋势参与 / 10% 品牌直推
      metrics: 互动率>5%、收藏率>8%（内容有实用价值）、CTA 点击率>3%
  wechat:
    name: 微信公众号
    desc: 深度长文
    tone: 专业可信、逻辑清晰、适度口语，观点有支撑
    max_chars: 3000
    structure: 引言抛出问题 → 观点展开 → 案例佐证 → 产品自然融入 → 总结升华与行动号召
    require_hashtags: false
    require_emoji: false
    seo_keywords: 标题优化与文中关键词覆盖
    copywriting_guide:
      title_rule: 有冲击力的标题 + 情感钩子（打开率翻倍的关键）；标题与正文布局搜索关键词
      body_structure: 逻辑清楚、要点列表、可扫读排版；标题分级、视觉层次分明；以读完率>50% 为目标
      style: 专业可信但不端着，开头用情感钩子抓住读者；数据与案例 > 观点和说教
  weibo:
    name: 微博
    desc: 短平快动态
    tone: 轻松有梗、直白有力、有网感
    max_chars: 280
    structure: 一句话钩子 → 核心信息 → 话题标签
    require_hashtags: true
    require_emoji: true
    seo_keywords: 核心关键词前置
    copywriting_guide:
      title_rule: 一句话钩子先行（争议性/情绪共鸣），核心信息紧随
      body_structure: 传播公式：争议性 × 参与门槛低 × 情绪共鸣；引导转发和评论（转发评论比点赞更有传播价值）
      tags_rule: 品牌主标签 + 活动子标签 + 热点借势标签
      style: 有网感、直白有力、不端着；控制在 280 字内，信息密度高
      reasoning_structure: 现象 → 机制 → 动作 → 指标/结果；没有数据时明确标注假设，不伪造结果
      expression_patterns: 结论前置、场景化痛点、数字锚点、对比、低门槛互动、适度反常识；抽象为可复用句式，不仿写具体博主
      research_evidence: 多样本归纳优先；区分作者观点与事实；少于 5 个独立样本时使用观察到/可能/待验证
      compliance_boundary: 不编造销量、价格、效果和微博来源；避免夸大承诺、虚假稀缺、整段复制和企业腔
  product_page:
    name: 电商产品页
    desc: 详情页文案
    tone: 卖点导向、信任背书、行动驱动，突出差异化
    max_chars: 1500
    structure: 主标题 → 核心卖点3-5条 → 信任背书 → 规格说明 → 行动号召
    require_hashtags: false
    require_emoji: false
    seo_keywords: 商品关键词覆盖与转化话术
    copywriting_guide:
      title_rule: 标题公式 = [品牌] + [核心关键词] + [属性] + [卖点] + [场景]
      body_structure: 核心卖点 Banner（3 秒内抓住注意力）→ 核心卖点 3-5 条（特性→优势→用户利益）→ 适用场景 → 已知规格与待补充项 → 有依据的信任说明 → 行动号召
      style: 转化导向、事实优先；每段只讲一个利益点；价格、材质、尺寸、认证、销量、评价与售后仅在任务明确提供时使用，禁止虚构价格锚点和社交证明
