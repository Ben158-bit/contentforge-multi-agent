services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # 默认演示模式（无需 API Key）；设置 FAKE_LLM=false + DEEPSEEK_API_KEY 走真实模型
      FAKE_LLM: ${FAKE_LLM:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - contentforge-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  contentforge-data:
